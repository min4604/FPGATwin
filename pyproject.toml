[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpgatwin"
version = "0.0.1"
description = "A digital twin for FPGA development boards: simulate RTL + pin constraints on a virtual board."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "min4604" }]
keywords = ["fpga", "simulation", "verilator", "ucf", "xdc", "virtual board"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[project.urls]
Repository = "https://github.com/min4604/FPGATwin"

[project.scripts]
fpgatwin = "fpgatwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpgatwin = [
    "boards/*/*.yaml",
    "primitives/**/*",
    "runtime/**/*",
    "ui/static/*",
    "rtl/*.in",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
